<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<style>
  :root{
    --bg:#0e1319; --surface:#161d26; --surface-2:#1b2531; --elev:#212c3a;
    --ink:#e9eef5; --muted:#8b99ab; --faint:#5f6c7d;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
    --accent:#2dd4bf; --accent-ink:#052e2a; --accent-soft:rgba(45,212,191,.16);
    --g:#4ade80; --g-bg:rgba(34,197,94,.14); --g-bg-h:rgba(34,197,94,.22); --g-bar:#22c55e; --g-line:rgba(34,197,94,.5);
    --y:#fbbf24; --y-bg:rgba(234,179,8,.14); --y-bg-h:rgba(234,179,8,.24); --y-bar:#eab308; --y-line:rgba(234,179,8,.5);
    --r:#f87171; --r-bg:rgba(248,113,113,.15); --r-bg-h:rgba(248,113,113,.24); --r-bar:#ef4444; --r-line:rgba(248,113,113,.5);
    --n:#8b99ab; --n-bg:rgba(139,153,171,.14);
    --danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
    --radius:12px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
  ::placeholder{color:var(--faint)}
  .num{font-variant-numeric:tabular-nums}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(14,19,25,.82);backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1280px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
  .brand h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em}
  .brand p{margin:0;color:var(--muted);font-size:12.5px}
  .qsel{display:flex;gap:8px;flex-wrap:wrap}
  .qgrp{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
  .qgrp button{padding:7px 12px;background:transparent;border:none;border-right:1px solid var(--line);color:var(--muted);font-weight:600;font-size:12.5px}
  .qgrp button:last-child{border-right:none}
  .qgrp button.active{background:var(--accent-soft);color:var(--accent)}
  .stats{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;line-height:1.15;padding-left:11px;border-left:2px solid var(--line-strong)}
  .stat b{font-size:17px;font-weight:650} .stat span{font-size:11px;color:var(--muted)}
  .stat.g{border-color:var(--g-bar)}.stat.g b{color:var(--g)}
  .stat.y{border-color:var(--y-bar)}.stat.y b{color:var(--y)}
  .stat.r{border-color:var(--r-bar)}.stat.r b{color:var(--r)}

  .wrap{max-width:1280px;margin:0 auto;padding:22px}

  .btn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s,transform .04s}
  .btn:hover{background:var(--elev);border-color:#3a4859}.btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
  .btn.primary:hover{background:#5fe3d4;border-color:#5fe3d4}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:rgba(248,113,113,.35);background:transparent}
  .btn.danger:hover{background:rgba(248,113,113,.12)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn svg{width:15px;height:15px;stroke-width:2}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{position:relative;flex:1;min-width:220px}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  select.filter{padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);outline:none;color:var(--ink)}
  select.filter:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .spacer{flex:1}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .tscroll{overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0}
  thead th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover td{background:rgba(255,255,255,.03)}
  tbody tr:last-child td{border-bottom:none}
  .comp{font-weight:600;letter-spacing:-.005em}
  .sub{color:var(--muted);font-size:12.5px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.g{color:var(--g);background:var(--g-bg-h)} .badge.y{color:var(--y);background:var(--y-bg-h)}
  .badge.r{color:var(--r);background:var(--r-bg-h)} .badge.n{color:var(--n);background:var(--n-bg)}
  .cchip{font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:1px 8px;border-radius:100px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)} .empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:15px}

  /* detail */
  .detail-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .titlewrap{flex:1;min-width:200px}
  .titlewrap input{font-size:22px;font-weight:650;letter-spacing:-.015em;border:1px solid transparent;background:transparent;color:var(--ink);width:100%;padding:4px 8px;border-radius:8px;margin-left:-8px}
  .titlewrap input:hover{background:var(--surface-2)}
  .titlewrap input:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .meta .field{display:flex;flex-direction:column;gap:3px}
  .meta label{font-size:11px;color:var(--muted);font-weight:600;padding-left:2px}
  .meta input{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:#0f1620;color:var(--ink);outline:none;min-width:160px}
  .meta input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .meta .field.grow{flex:1 1 280px}
  .meta .field.grow input{width:100%}
  .meta select{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:#0f1620;color:var(--ink);outline:none;min-width:90px}
  .meta select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .meta .field.grow{flex:1 1 180px}
  .formswrap{position:relative;align-self:flex-end}
  .formspop{position:absolute;top:calc(100% + 6px);right:0;min-width:236px;background:var(--elev);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);z-index:30;display:none;overflow:hidden}
  .formspop.open{display:block}
  .fphead{padding:9px 12px;font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .fphint{padding:8px 12px;font-size:11px;color:var(--faint);border-top:1px solid var(--line)}
  .fsum{margin-left:2px;color:var(--muted);font-weight:700}
  .ffal{margin-left:6px;color:var(--r);font-weight:800}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:8px 12px;color:var(--ink);font-size:13px;cursor:pointer}
  .frow:hover{background:var(--surface-2)}
  .fname{font-weight:600}
  .chk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:5px;font-size:13px;font-weight:800;line-height:1;color:var(--muted)}
  .chk.ok{color:var(--g);border-color:var(--g-line);background:var(--g-bg)}
  .chk.fal{color:var(--r);border-color:var(--r-line);background:var(--r-bg)}

  .summary{display:flex;gap:18px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .summary .s{display:flex;flex-direction:column;line-height:1.2}
  .summary .s b{font-size:16px;font-variant-numeric:tabular-nums}
  .summary .s span{font-size:11px;color:var(--muted)}
  .summary .s.r b{color:var(--r)} .summary .s.g b{color:var(--g)} .summary .s.y b{color:var(--y)}

  table.grid{min-width:1120px}
  table.grid th{font-size:10.5px;line-height:1.3;vertical-align:bottom;padding:10px 10px;white-space:normal;max-width:120px}
  table.grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:middle}
  table.grid td:first-child,table.grid th:first-child{border-left:1px solid var(--line)}
  table.grid tr:hover td{background:transparent}
  table.grid td input{width:100%;border:none;background:transparent;color:var(--ink);padding:9px 10px;outline:none;font-size:13px}
  table.grid td input:focus{box-shadow:inset 0 0 0 2px var(--accent);background:#0f1620}
  table.grid td.money input,table.grid td.diff{text-align:right;font-variant-numeric:tabular-nums}
  table.grid td.date input{min-width:96px}
  table.grid td.notes input{min-width:150px}
  table.grid td.diff{padding:9px 10px;font-weight:650;color:var(--muted)}
  table.grid td.wk{padding:9px 10px;color:var(--faint);font-size:12px;text-align:center}
  table.grid td.act{padding:0 6px;text-align:center}
  .rowdel{color:var(--muted);border:none;background:transparent;padding:5px;border-radius:6px;display:inline-flex}
  .rowdel:hover{color:var(--danger);background:rgba(248,113,113,.12)}
  .rowdel svg{width:15px;height:15px}
  .cell-g{background:var(--g-bg)!important;color:var(--g)!important;box-shadow:inset 0 0 0 1px var(--g-line)}
  .cell-g input{color:var(--g);font-weight:600}
  .cell-r{background:var(--r-bg)!important;color:var(--r)!important;box-shadow:inset 0 0 0 1px var(--r-line)}
  .cell-r input{color:var(--r);font-weight:600}
  td.regpend{background:var(--y-bg)!important;box-shadow:inset 0 0 0 1px var(--y-line)}
  td.regpend input::placeholder{color:var(--y);font-weight:800;opacity:1;letter-spacing:.03em}

  .gridbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .legend .lg{background:var(--g-bg-h);box-shadow:inset 0 0 0 1px var(--g-line)}
  .legend .lr{background:var(--r-bg-h);box-shadow:inset 0 0 0 1px var(--r-line)}
  .legend .lp{background:var(--y-bg-h);box-shadow:inset 0 0 0 1px var(--y-line)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--elev);color:var(--ink);border:1px solid var(--line-strong);padding:9px 16px;border-radius:100px;font-size:13px;font-weight:550;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translate(-50%,0)} .toast svg{width:15px;height:15px;color:var(--g)}

  @media (max-width:900px){ .col-hide{display:none} }
  @media (max-width:560px){ .wrap{padding:14px} .topbar-in{padding:12px 16px} }
</style>
</head>

  <script>
  (function(){
    "use strict";
    var KEY="quarters_v1";
    var SEED=JSON.parse(document.getElementById("seed").textContent);
    var state={companies:[]};
    var route={name:"list", id:null};
    var curQ="2026-Q4";

    var YEARS=[2026,2027,2028,2029,2030];
    function qStart(key){ var m=String(key).match(/(\d{4})-Q(\d)/); var y=+m[1],q=+m[2]; return ((q-1)*3+1)+"/1/"+y; }
    function qLabel(key){ var m=String(key).match(/(\d{4})-Q(\d)/); return "Q"+m[2]+" "+m[1]; }
    function qMeta(key){ return {k:key,label:qLabel(key),start:qStart(key)}; }
    function curYear(){ return curQ.slice(0,4); }
    function curQn(){ return curQ.slice(-1); }
    function freqOf(tipo){ var t=(tipo||"").toLowerCase(); if(/bi\s*-?\s*week|quincen/.test(t)) return 2; return 1; }
    function genRows(qkey,step){ var start=parseDate(qStart(qkey)), end=new Date(start.getFullYear(),start.getMonth()+3,0); var d=new Date(start); while(d.getDay()!==5) d.setDate(d.getDate()+1); var out=[]; while(d.getTime()<=end.getTime()){ var chk=fmtD(d); out.push(blankRow(chk,addDays(chk,5))); d.setDate(d.getDate()+7*step); } return out; }
    function scaffoldIfNeeded(c){ if(!c.quarters) c.quarters={}; if(c.quarters[curQ]===undefined){ var f=freqOf(c.tipo); c.quarters[curQ]= f>0?genRows(curQ,f):[]; return true; } return false; }
    function formsFor(c){ var base=[(c.form||"941"),"DE9","DE9C"]; if(curQn()==="4") base=base.concat(["W3","W2"]); return base; }
    function formState(c,name){ var q=c.formsChk&&c.formsChk[curQ]; return (q&&q[name])||""; }
    function setFormState(c,name,st){ if(!c.formsChk)c.formsChk={}; if(!c.formsChk[curQ])c.formsChk[curQ]={}; c.formsChk[curQ][name]=st; }
    function nextFormState(st){ return st==="ok"?"falta":(st==="falta"?"":"ok"); }
    function chkHTML(st){ var cl=st==="ok"?"chk ok":(st==="falta"?"chk fal":"chk"); var sym=st==="ok"?"\u2713":(st==="falta"?"\u2715":"\u200b"); return '<span class="'+cl+'">'+sym+'</span>'; }
    function formsWidgetHTML(c){
      var list=formsFor(c), ok=0,fal=0; list.forEach(function(n){ var s=formState(c,n); if(s==="ok")ok++; else if(s==="falta")fal++; });
      return '<div class="formswrap" id="formswrap">'+
        '<button type="button" class="btn sm" id="formsBtn">'+icon("folder")+'Forms <span class="fsum" id="fsum">'+ok+'/'+list.length+'</span>'+
        '<span class="ffal" id="ffal"'+(fal?'':' style="display:none"')+'>'+fal+' \u2715</span></button>'+
        '<div class="formspop" id="formspop">'+
          '<div class="fphead">Guardado en carpeta \u00b7 '+esc(qMeta(curQ).label)+'</div>'+
          list.map(function(n){ return '<button type="button" class="frow" data-form="'+esc(n)+'"><span class="fname">'+esc(n)+'</span>'+chkHTML(formState(c,n))+'</button>'; }).join("")+
          '<div class="fphint">Clic para alternar: vac\u00edo \u2192 \u2713 guardado \u2192 \u2715 falta</div>'+
        '</div></div>';
    }
    function bindForms(c){
      var btn=document.getElementById("formsBtn"), pop=document.getElementById("formspop"); if(!btn) return;
      btn.addEventListener("click",function(e){ e.stopPropagation(); pop.classList.toggle("open"); });
      Array.prototype.forEach.call(pop.querySelectorAll(".frow"),function(b){
        b.addEventListener("click",function(e){ e.stopPropagation();
          var n=b.getAttribute("data-form"); var st=nextFormState(formState(c,n)); setFormState(c,n,st); saveDebounced();
          b.querySelector(".chk").outerHTML=chkHTML(st);
          var list=formsFor(c),ok=0,fal=0; list.forEach(function(m){ var s=formState(c,m); if(s==="ok")ok++; else if(s==="falta")fal++; });
          document.getElementById("fsum").textContent=ok+"/"+list.length;
          var ff=document.getElementById("ffal"); ff.textContent=fal+" \u2715"; ff.style.display=fal?"":"none";
        });
      });
    }

    /* ---------- storage (navegador o visor de Claude) ---------- */
    var mode="memory", _mem=null, dirty=false, saveTimer=null;
    function detectMode(){
      /* Preferimos la NUBE (window.storage lo define config.js) para que los
         datos sean compartidos entre todas las PCs. Si no está, caemos a local. */
      if(typeof window!=="undefined" && window.storage && typeof window.storage.get==="function"){ mode="cloud"; return; }
      try{ var k="__t"+Date.now(); localStorage.setItem(k,"1"); localStorage.removeItem(k); mode="local"; return; }catch(e){}
      mode="memory";
    }
    async function loadState(){
      try{
        if(mode==="local"){ var v=localStorage.getItem(KEY); if(v){ state=JSON.parse(v); return; } }
        else if(mode==="cloud"){ var r=await window.storage.get(KEY); if(r&&r.value){ state=JSON.parse(r.value); return; } }
      }catch(e){}
      state=clone(SEED);
    }
    function persist(){
      var payload=JSON.stringify(state);
      try{
        if(mode==="local"){ localStorage.setItem(KEY,payload); }
        else if(mode==="cloud"){ window.storage.set(KEY,payload); }
        else { _mem=payload; }
      }catch(e){}
      dirty=false;
    }
    async function saveState(silent){ persist(); if(!silent) toast("Guardado"); }
    function saveDebounced(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(persist,300); }
    function migrateState(){
      var changed=false;
      if(!state.companies) { state.companies=[]; changed=true; }
      state.companies.forEach(function(c){
        if(!c.id){ c.id=uid(); changed=true; }
        if(!c.quarters){ c.quarters={}; changed=true; }
        if(!c.form){ c.form=/943/.test(c.nombre||"")?"943":"941"; changed=true; }
      });
      return changed;
    }

    /* ---------- helpers ---------- */
    function clone(x){ return JSON.parse(JSON.stringify(x)); }
    function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
    function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
    function byId(id){ return state.companies.find(function(c){return c.id===id;}); }
    function rowsOf(c,q){ return (c.quarters&&c.quarters[q])?c.quarters[q]:[]; }

    function parseMoney(s){ if(s==null) return null; s=String(s).replace(/[^0-9.\-]/g,''); if(s===""||s==="-"||s===".") return null; var n=parseFloat(s); return isNaN(n)?null:n; }
    function fmtMoney(n){ if(n==null||isNaN(n)) return ""; var s=Math.round(n*100)/100; return s.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2}); }
    function parseDate(s){ if(!s) return null; var m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m) return null; var y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[1]-1,+m[2]); }
    function fmtD(d){ return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear(); }
    function addDays(str,n){ var d=parseDate(str); if(!d) return ""; d.setDate(d.getDate()+n); return fmtD(d); }
    function normDate(s){
      s=(s||"").trim(); if(!s) return "";
      if(s.indexOf("/")>=0){ var p=parseDate(s); return p?fmtD(p):s; }
      var g=s.replace(/\D/g,""), mm,dd,yy;
      if(g.length===8){ mm=+g.slice(0,2); dd=+g.slice(2,4); yy=+g.slice(4,8); }
      else if(g.length===6){ mm=+g.slice(0,2); dd=+g.slice(2,4); yy=2000+ +g.slice(4,6); }
      else return s;
      if(mm>=1&&mm<=12&&dd>=1&&dd<=31&&yy>1900) return mm+"/"+dd+"/"+yy;
      return s;
    }
    var DATEF={fechaCheque:1,fechaLimite:1,fechaPago:1};
    function isOverdueRegister(r){ var d=parseDate(r.fechaCheque); if(!d) return false; d.setDate(d.getDate()+7); return new Date().getTime()>d.getTime(); }

    function diff(a,b){ return (a==null||b==null)?null:Math.round((a-b)*100)/100; }
    function payColor(r){
      if(!r.fechaPago||!r.fechaLimite) return "";
      var p=parseDate(r.fechaPago), l=parseDate(r.fechaLimite); if(!p||!l) return "";
      return (p.getTime()<=l.getTime())?"g":"r";
    }
    function diffColor(v){ return v==null?"":(Math.abs(v)<=5?"g":"r"); }
    function computeDiffs(rows){
      var out=[], rp1=0, rpE=0, any1=false, anyE=false;
      rows.forEach(function(r){
        var p1=parseMoney(r.pago941); if(p1!=null){ rp1+=p1; any1=true; }
        var pe=parseMoney(r.pagoEDD); if(pe!=null){ rpE+=pe; anyE=true; }
        var reg1=parseMoney(r.acum941), regE=parseMoney(r.acumEDD);
        out.push({ d941: reg1==null?null:Math.round((reg1-rp1)*100)/100,
                   dedd: regE==null?null:Math.round((regE-rpE)*100)/100,
                   paid941: any1, paidEDD: anyE });
      });
      return out;
    }

    function statusOf(c,q){
      var rows=rowsOf(c,q);
      if(!rows.length) return {label:"Sin datos",c:"n",late:0,pend:0,rev:0};
      var late=0,pend=0,rev=0, ds=computeDiffs(rows);
      rows.forEach(function(r,i){
        if(payColor(r)==="r") late++;
        if(isOverdueRegister(r) && (parseMoney(r.acum941)==null||parseMoney(r.acumEDD)==null)) pend++;
        if(ds[i].paid941 && ds[i].d941!=null && Math.abs(ds[i].d941)>5) rev++;
        if(ds[i].paidEDD && ds[i].dedd!=null && Math.abs(ds[i].dedd)>5) rev++;
      });
      if(rev>0||late>0) return {label:"Revisar",c:"r",late:late,pend:pend,rev:rev};
      if(pend>0) return {label:"Pendiente",c:"y",late:0,pend:pend,rev:0};
      return {label:"Al día",c:"g",late:0,pend:0,rev:0};
    }

    /* ---------- top: quarter selector + stats ---------- */
    function renderQSel(){
      var y=curYear(), qn=curQn();
      var ys=YEARS.map(function(yr){ return '<button data-y="'+yr+'"'+(String(yr)===y?' class="active"':'')+'>'+yr+'</button>'; }).join("");
      var qs=[1,2,3,4].map(function(n){ return '<button data-qn="'+n+'"'+(String(n)===qn?' class="active"':'')+'>Q'+n+'</button>'; }).join("");
      document.getElementById("qsel").innerHTML='<div class="qgrp">'+ys+'</div><div class="qgrp">'+qs+'</div>';
      Array.prototype.forEach.call(document.querySelectorAll("#qsel [data-y]"),function(b){ b.addEventListener("click",function(){ curQ=b.getAttribute("data-y")+"-Q"+curQn(); persistUI(); render(); }); });
      Array.prototype.forEach.call(document.querySelectorAll("#qsel [data-qn]"),function(b){ b.addEventListener("click",function(){ curQ=curYear()+"-Q"+b.getAttribute("data-qn"); persistUI(); render(); }); });
    }
    function persistUI(){ state.ui={q:curQ}; saveDebounced(); }
    function renderStats(){
      var g=0,y=0,r=0;
      state.companies.forEach(function(c){ var s=statusOf(c,curQ).c; if(s==="g")g++; else if(s==="y")y++; else if(s==="r")r++; });
      document.getElementById("stats").innerHTML=
        stat(state.companies.length,"Empresas","")+stat(g,"Al día","g")+stat(y,"Pendiente","y")+stat(r,"A revisar","r");
    }
    function stat(n,l,c){ return '<div class="stat '+c+'"><b class="num">'+n+'</b><span>'+l+'</span></div>'; }

    /* ---------- LIST ---------- */
    var listQuery="", listFilter="__all__";
    function renderList(){
      document.getElementById("crumb").textContent="Control semanal de pagos 941/943 y EDD";
      var tipos=Array.from(new Set(state.companies.map(function(c){return c.tipo;}).filter(Boolean))).sort();
      var rows=state.companies.slice();
      var q=listQuery.toLowerCase().trim();
      if(q) rows=rows.filter(function(c){ return (c.nombre+" "+c.tipo).toLowerCase().indexOf(q)>=0; });
      if(listFilter==="__prob__") rows=rows.filter(function(c){ return statusOf(c,curQ).c==="r"; });
      else if(listFilter==="__pend__") rows=rows.filter(function(c){ return statusOf(c,curQ).c==="y"; });
      else if(listFilter!=="__all__") rows=rows.filter(function(c){ return c.tipo===listFilter; });

      var opts='<option value="__all__">Todos</option>'+
        '<option value="__prob__">Solo a revisar</option>'+

        '<optgroup label="Frecuencia de pago">'+tipos.map(function(t){return '<option value="'+esc(t)+'"'+(t===listFilter?" selected":"")+'>'+esc(t)+'</option>';}).join("")+'</optgroup>';

      var body;
      if(!rows.length){
        body='<div class="empty"><b>No hay empresas que coincidan</b>Probá con otra búsqueda o filtro.</div>';
      }else{
        body='<div class="tscroll"><table><thead><tr>'+
          '<th>Empresa</th><th>Frecuencia de pago</th><th>Form</th><th>Situación '+esc(qMeta(curQ).label)+'</th>'+
          '<th class="col-hide">Semanas</th><th class="col-hide">Atrasos</th><th class="col-hide">A revisar</th>'+
          '</tr></thead><tbody>'+
          rows.map(function(c){
            var s=statusOf(c,curQ); var n=rowsOf(c,curQ).length;
            return '<tr data-id="'+c.id+'">'+
              '<td><div class="comp">'+esc(c.nombre)+'</div></td>'+

              '<td><span class="cchip">'+esc(c.form||"941")+'</span></td>'+
              '<td><span class="badge '+s.c+'">'+esc(s.label)+'</span></td>'+
              '<td class="col-hide num sub">'+(n||"—")+'</td>'+
              '<td class="col-hide num">'+(s.late?'<span style="color:var(--r);font-weight:600">'+s.late+'</span>':'<span class="sub">0</span>')+'</td>'+
              '<td class="col-hide num">'+(s.rev?'<span style="color:var(--r);font-weight:600">'+s.rev+'</span>':'<span class="sub">0</span>')+'</td>'+
            '</tr>';
          }).join("")+
          '</tbody></table></div>';
      }

      document.getElementById("view").innerHTML=
        '<div class="toolbar">'+
          '<div class="search">'+icon("search")+'<input id="q" placeholder="Buscar empresa…" value="'+esc(listQuery)+'"></div>'+
          '<select class="filter" id="filter">'+opts+'</select>'+
          '<div class="spacer"></div>'+
          '<button class="btn" id="btnGenAll">'+icon("calendar")+'Generar semanas</button>'+
          '<button class="btn" id="btnExport">'+icon("download")+'CSV</button>'+
          '<button class="btn" id="btnBackup">'+icon("save")+'Backup</button>'+
          '<button class="btn" id="btnRestore">'+icon("upload")+'Restaurar</button>'+
          '<button class="btn primary" id="btnNew">'+icon("plus")+'Empresa</button>'+
        '</div>'+
        '<div class="card">'+body+'</div>'+
        '<input type="file" id="fileIn" accept="application/json" style="display:none">';

      var qEl=document.getElementById("q");
      qEl.addEventListener("input",function(){ listQuery=this.value; var p=this.selectionStart; renderList(); var nn=document.getElementById("q"); nn.focus(); try{nn.setSelectionRange(p,p);}catch(e){} });
      document.getElementById("filter").addEventListener("change",function(){ listFilter=this.value; renderList(); });
      document.getElementById("btnNew").addEventListener("click",newCompany);
      document.getElementById("btnGenAll").addEventListener("click",genAll);
      document.getElementById("btnExport").addEventListener("click",exportCSV);
      document.getElementById("btnBackup").addEventListener("click",backup);
      document.getElementById("btnRestore").addEventListener("click",function(){document.getElementById("fileIn").click();});
      document.getElementById("fileIn").addEventListener("change",restore);
      Array.prototype.forEach.call(document.querySelectorAll("tbody tr"),function(tr){ tr.addEventListener("click",function(){ open(tr.getAttribute("data-id")); }); });
    }

    /* ---------- DETAIL (quarter grid) ---------- */
    var COLS=[
      ["fechaCheque","Fecha de cheque","date"],
      ["acum941","941/943 acumulado Register","money"],
      ["acumEDD","EDD acumulado Register","money"],
      ["fechaLimite","Fecha límite de pago","date"],
      ["fechaPago","Fecha de pago","date pay"],
      ["pago941","941/943 pagado","money"],
      ["pagoEDD","EDD pagado","money"],
      ["_d941","Diferencia 941/943","diff941"],
      ["_dedd","Diferencia EDD","diffedd"],
      ["notas","Notas","notes"]
    ];

    function renderDetail(){
      var c=byId(route.id);
      if(!c){ route={name:"list"}; return render(); }
      document.getElementById("crumb").textContent=c.nombre;
      var rows=rowsOf(c,curQ);
      var start=qMeta(curQ).start;

      var head='<tr><th class="wk">#</th>'+COLS.map(function(col){
        var lbl=col[1];
        if(col[0]==="acum941"||col[0]==="acumEDD") lbl+=' <span style="color:var(--faint)">(desde '+esc(start)+')</span>';
        return '<th>'+lbl+'</th>';
      }).join("")+'<th class="act"></th></tr>';

      var ds=computeDiffs(rows);
      var trs=rows.map(function(r,i){
        var cells=COLS.map(function(col){
          var key=col[0], type=col[2];
          if(key==="_d941"){ var v=ds[i].d941, col=diffCellColor(v,ds[i].paid941); return '<td class="diff d941 '+(col?"cell-"+col:"")+'"><span>'+(v==null?"":fmtMoney(v))+'</span></td>'; }
          if(key==="_dedd"){ var v2=ds[i].dedd, col2=diffCellColor(v2,ds[i].paidEDD); return '<td class="diff dedd '+(col2?"cell-"+col2:"")+'"><span>'+(v2==null?"":fmtMoney(v2))+'</span></td>'; }
          var cls=type.split(" ")[0];
          var extra=(key==="fechaPago")?(" paycell "+(payColor(r)?"cell-"+payColor(r):"")):"";
          var ph=(cls==="date")?' placeholder="MMDDAAAA"':'';
          if((key==="acum941"||key==="acumEDD") && !(r[key]&&String(r[key]).trim()) && isOverdueRegister(r)){ extra+=" regpend"; ph=' placeholder="PENDIENTE"'; }
          return '<td class="'+cls+extra+'"><input data-r="'+i+'" data-f="'+key+'"'+ph+' value="'+esc(r[key]||"")+'"></td>';
        }).join("");
        return '<tr data-i="'+i+'"><td class="wk">'+(i+1)+'</td>'+cells+'<td class="act"><button class="rowdel" title="Eliminar semana">'+icon("trash")+'</button></td></tr>';
      }).join("");

      document.getElementById("view").innerHTML=
        '<div class="detail-top">'+
          '<button class="btn ghost" id="back">'+icon("back")+'Volver</button>'+
          '<div class="titlewrap"><input id="nombre" value="'+esc(c.nombre)+'" placeholder="Nombre de la empresa"></div>'+
          '<button class="btn danger sm" id="delC">'+icon("trash")+'Eliminar empresa</button>'+
        '</div>'+
        '<div class="meta">'+
          '<div class="field"><label>Frecuencia de pago</label><input id="tipo" value="'+esc(c.tipo||"")+'" placeholder="Weekly, Bi-weekly…"></div>'+
          '<div class="field"><label>Form</label><select id="form"><option value="941"'+((c.form||"941")==="943"?"":" selected")+'>941</option><option value="943"'+((c.form||"941")==="943"?" selected":"")+'>943</option></select></div>'+
          '<div class="field"><label>Estado</label><input id="estado" value="'+esc(c.estado||"")+'" placeholder="—"></div>'+
          '<div class="field grow"><label>Nota especial</label><input id="nota" value="'+esc(c.nota||"")+'" placeholder="Dato importante…"></div>'+
          formsWidgetHTML(c)+
        '</div>'+
        '<div class="summary" id="summary"></div>'+
        '<div class="gridbar">'+
          '<button class="btn sm primary" id="addRow">'+icon("plus")+'Agregar semana</button>'+
          '<button class="btn sm" id="genW">Generar viernes del trimestre</button>'+
          '<button class="btn sm" id="genB">Generar quincenal</button>'+
          '<div class="spacer"></div>'+
        '</div>'+
        '<div class="card"><div class="tscroll"><table class="grid"><thead>'+head+'</thead><tbody id="gbody">'+
          (rows.length?trs:'<tr><td colspan="12" class="empty" style="cursor:default"><b>Sin semanas cargadas para '+esc(qMeta(curQ).label)+'</b>Usá “Agregar semana” o “Generar viernes del trimestre”.</td></tr>')+
        '</tbody></table></div></div>'+
        '<div class="legend">'+
          '<span><i class="lg"></i>Pago en fecha / diferencia ≤ $5</span>'+
          '<span><i class="lr"></i>Pago fuera de término / diferencia &gt; $5</span>'+
          '<span><i class="lp"></i>Register pendiente (7+ días sin cargar)</span>'+
          '<span style="color:var(--faint)">Revisar aparece solo cuando el pago está cargado y no coincide con el Register.</span>'+
        '</div>';

      updateSummary(c);
      document.getElementById("back").addEventListener("click",function(){ route={name:"list"}; render(); });
      document.getElementById("delC").addEventListener("click",function(){ deleteCompany(c.id); });
      bindMeta(c,"nombre",function(v){ document.getElementById("crumb").textContent=v||"Empresa"; });
      bindMeta(c,"tipo"); bindMeta(c,"estado"); bindMeta(c,"nota");
      var formEl=document.getElementById("form"); if(formEl) formEl.addEventListener("change",function(){ c.form=formEl.value; saveDebounced(); renderDetail(); });
      bindForms(c);

      document.getElementById("addRow").addEventListener("click",function(){ ensureQ(c); c.quarters[curQ].push(blankRow("","")); saveState(true); renderDetail(); });
      document.getElementById("genW").addEventListener("click",function(){ genWeeks(c,1); });
      document.getElementById("genB").addEventListener("click",function(){ genWeeks(c,2); });

      // cell inputs — targeted live updates (no full re-render, keeps focus)
      Array.prototype.forEach.call(document.querySelectorAll("#gbody input"),function(inp){
        inp.addEventListener("input",function(){
          var i=+inp.getAttribute("data-r"), f=inp.getAttribute("data-f");
          c.quarters[curQ][i][f]=inp.value;
          refreshComputedFor(c);
          updateSummary(c);
          saveDebounced();
        });
        if(DATEF[inp.getAttribute("data-f")]){
          inp.addEventListener("blur",function(){
            var i=+inp.getAttribute("data-r"), f=inp.getAttribute("data-f");
            var nv=normDate(inp.value);
            if(nv!==inp.value){ inp.value=nv; c.quarters[curQ][i][f]=nv; refreshComputedFor(c); updateSummary(c); saveDebounced(); }
          });
          inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ inp.blur(); } });
        }
      });
      Array.prototype.forEach.call(document.querySelectorAll("#gbody .rowdel"),function(b){
        b.addEventListener("click",function(){
          var i=+b.closest("tr").getAttribute("data-i");
          c.quarters[curQ].splice(i,1); saveState(true); renderDetail();
        });
      });
    }

    function bindMeta(c,field,after){
      var el=document.getElementById(field);
      el.addEventListener("input",function(){ c[field]=el.value; if(after)after(el.value); saveDebounced(); });
    }
    function refreshComputedFor(c){
      var rows=rowsOf(c,curQ), ds=computeDiffs(rows);
      Array.prototype.forEach.call(document.querySelectorAll("#gbody tr[data-i]"),function(tr){
        var i=+tr.getAttribute("data-i"); if(!ds[i])return; var r=rows[i];
        setDiff(tr.querySelector(".d941"), ds[i].d941, diffCellColor(ds[i].d941,ds[i].paid941));
        setDiff(tr.querySelector(".dedd"), ds[i].dedd, diffCellColor(ds[i].dedd,ds[i].paidEDD));
        var pc=tr.querySelector(".paycell"); if(pc){ pc.classList.remove("cell-g","cell-r"); var col=payColor(r); if(col)pc.classList.add("cell-"+col); }
        ["acum941","acumEDD"].forEach(function(k){
          var inp=tr.querySelector('input[data-f="'+k+'"]'); if(!inp)return; var td=inp.closest("td");
          if(!(inp.value&&inp.value.trim()) && isOverdueRegister(r)){ td.classList.add("regpend"); inp.placeholder="PENDIENTE"; }
          else { td.classList.remove("regpend"); inp.placeholder=""; }
        });
      });
    }
    function diffCellColor(v,hasPaid){ if(v==null||!hasPaid) return ""; return Math.abs(v)<=5?"g":"r"; }
    function setDiff(td,v,col){ if(!td)return; td.classList.remove("cell-g","cell-r"); td.querySelector("span").textContent=(v==null?"":fmtMoney(v)); if(col)td.classList.add("cell-"+col); }
    function updateSummary(c){
      var rows=rowsOf(c,curQ), ds=computeDiffs(rows), s941=0,sEDD=0,late=0,rev=0,pend=0;
      rows.forEach(function(r,i){
        var p1=parseMoney(r.pago941); if(p1!=null)s941+=p1;
        var pe=parseMoney(r.pagoEDD); if(pe!=null)sEDD+=pe;
        if(payColor(r)==="r")late++;
        if(isOverdueRegister(r) && (parseMoney(r.acum941)==null||parseMoney(r.acumEDD)==null)) pend++;
        if(ds[i].paid941 && ds[i].d941!=null && Math.abs(ds[i].d941)>5) rev++;
        if(ds[i].paidEDD && ds[i].dedd!=null && Math.abs(ds[i].dedd)>5) rev++;
      });
      var el=document.getElementById("summary"); if(!el)return;
      el.innerHTML=
        sBlock("$"+fmtMoney(s941),"941/943 pagado")+
        sBlock("$"+fmtMoney(sEDD),"EDD pagado")+
        sBlock(String(rows.length),"Semanas")+
        sBlock(String(pend),"Register pendiente",pend?"y":"")+
        sBlock(String(late),"Pagos fuera de término",late?"r":"")+
        sBlock(String(rev),"Diferencias a revisar",rev?"r":"");
    }
    function sBlock(v,l,c){ return '<div class="s '+(c||"")+'"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'; }

    function ensureQ(c){ if(!c.quarters)c.quarters={}; if(!c.quarters[curQ])c.quarters[curQ]=[]; }
    function blankRow(chk,dl){ return {fechaCheque:chk,acum941:"",acumEDD:"",fechaLimite:dl,fechaPago:"",pago941:"",pagoEDD:"",notas:""}; }
    function genWeeks(c,step){
      var rows=rowsOf(c,curQ);
      if(rows.length && !confirm("Esto reemplaza las "+rows.length+" semanas cargadas en "+qMeta(curQ).label+" por fechas nuevas. ¿Continuar?")) return;
      var start=parseDate(qMeta(curQ).start), end=new Date(start.getFullYear(),start.getMonth()+3,0);
      var d=new Date(start); while(d.getDay()!==5) d.setDate(d.getDate()+1); // primer viernes
      var out=[];
      while(d.getTime()<=end.getTime()){ var chk=fmtD(d); out.push(blankRow(chk,addDays(chk,5))); d.setDate(d.getDate()+7*step); }
      ensureQ(c); c.quarters[curQ]=out; saveState(false); renderDetail();
    }

    /* ---------- actions ---------- */
    function open(id){ var c=byId(id); if(c && scaffoldIfNeeded(c)) saveState(true); route={name:"detail",id:id}; render(); window.scrollTo(0,0); }
    function genAll(){
      if(!confirm("¿Generar las semanas de "+qMeta(curQ).label+" para todas las empresas? Bi-weekly = quincenal; el resto = weekly (viernes de cada semana). Solo completa las que todavía no tienen semanas cargadas en este trimestre; nunca pisa datos ya ingresados.")) return;
      var done=0;
      state.companies.forEach(function(c){ if(!c.quarters)c.quarters={}; var q=c.quarters[curQ]; if(q===undefined || (Array.isArray(q)&&q.length===0)){ c.quarters[curQ]=genRows(curQ,freqOf(c.tipo)); done++; } });
      saveState(false); render(); toast(done+" empresas generadas");
    }
    function newCompany(){
      var c={id:uid(),nombre:"",tipo:"",estado:"",quarters:{}};
      state.companies.unshift(c); saveState(true); open(c.id);
      setTimeout(function(){var n=document.getElementById("nombre"); if(n)n.focus();},50);
    }
    function deleteCompany(id){
      var c=byId(id);
      if(!confirm('¿Eliminar la empresa "'+(c&&c.nombre||"")+'" y todos sus trimestres? No se puede deshacer.')) return;
      state.companies=state.companies.filter(function(x){return x.id!==id;});
      saveState(false); route={name:"list"}; render();
    }

    function exportCSV(){
      function cell(v){ v=(v==null?"":String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
      var head=["Empresa","Tipo","Trimestre","Fecha de cheque","941/943 acumulado Register","EDD acumulado Register","Fecha límite","Fecha de pago","941/943 pagado","EDD pagado","Diferencia 941/943","Diferencia EDD","Estado pago","Notas"].map(cell).join(",");
      var lines=[];
      state.companies.forEach(function(c){
        var rows=rowsOf(c,curQ);
        if(!rows.length){ return; }
        var ds=computeDiffs(rows);
        rows.forEach(function(r,i){
          var d1=ds[i].d941, d2=ds[i].dedd;
          var pc=payColor(r); var pcTxt=pc==="g"?"En fecha":(pc==="r"?"Fuera de término":"");
          lines.push([cell(c.nombre),cell(c.tipo),cell(qMeta(curQ).label),cell(r.fechaCheque),cell(r.acum941),cell(r.acumEDD),
            cell(r.fechaLimite),cell(r.fechaPago),cell(r.pago941),cell(r.pagoEDD),
            cell(d1==null?"":d1),cell(d2==null?"":d2),cell(pcTxt),cell(r.notas)].join(","));
        });
      });
      download("taxes_"+curQ+".csv","\ufeff"+head+"\n"+lines.join("\n"),"text/csv");
      toast("CSV exportado ("+qMeta(curQ).label+")");
    }
    function backup(){ download("taxes_backup.json",JSON.stringify(state,null,2),"application/json"); toast("Backup descargado"); }
    function restore(e){
      var f=e.target.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(){
        try{
          var data=JSON.parse(r.result); if(!data||!Array.isArray(data.companies)) throw 0;
          if(!confirm("Esto reemplaza los datos actuales por los del archivo ("+data.companies.length+" empresas). ¿Continuar?")) return;
          state=data; migrateState(); saveState(false); route={name:"list"}; render();
        }catch(err){ alert("El archivo no es un backup válido."); }
      };
      r.readAsText(f); e.target.value="";
    }
    function download(name,content,type){ var b=new Blob([content],{type:type}); var u=URL.createObjectURL(b); var a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(function(){URL.revokeObjectURL(u);},1500); }

    /* ---------- toast ---------- */
    var toastTimer=null;
    function toast(msg){ var el=document.getElementById("toast"); el.innerHTML=icon("check")+esc(msg); el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove("show");},1400); }

    /* ---------- icons ---------- */
    function icon(n){
      var s='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">';
      var p={ search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', plus:'<path d="M12 5v14M5 12h14"/>',
        back:'<path d="M15 18l-6-6 6-6"/>', trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
        download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', upload:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',
        save:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/>', check:'<path d="M4 12l5 5L20 6"/>', calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>', folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' }[n]||"";
      return s+p+'</svg>';
    }

    function memoryBanner(){
      var b=document.createElement("div");
      b.style.cssText="max-width:1280px;margin:0 auto;padding:10px 22px 0;color:var(--y);font-size:12.5px;line-height:1.45";
      b.innerHTML="&#9888; Este navegador no está guardando los cambios de forma automática. Usá <b>Backup</b> para descargar tus datos y <b>Restaurar</b> para volver a cargarlos.";
      document.body.insertBefore(b, document.getElementById("view"));
    }

    /* ---------- router ---------- */
    function ensureQuarterFilled(){
      var changed=false;
      state.companies.forEach(function(c){ if(!c.quarters)c.quarters={}; var q=c.quarters[curQ]; if(q===undefined || (Array.isArray(q)&&q.length===0)){ c.quarters[curQ]=genRows(curQ,freqOf(c.tipo)); changed=true; } });
      if(changed) saveDebounced();
    }
    function render(){ ensureQuarterFilled(); renderQSel(); renderStats(); if(route.name==="detail") renderDetail(); else renderList(); }

    /* ---------- boot ---------- */
    (async function(){
      detectMode();
      await loadState();
      var m=migrateState();
      if(state.ui&&state.ui.q) curQ=state.ui.q;
      if(m) persist();
      render();
      /* la sincronización (config.js) llama a esto cuando otro equipo guardó */
      window.__txReload=async function(){ try{ await loadState(); migrateState(); if(state.ui&&state.ui.q) curQ=state.ui.q; render(); }catch(e){} };
      /* si la nube estaba vacía (primera vez), la sembramos con este estado */
      if(mode==="cloud" && window.__txEmpty) persist();
      if(mode==="memory") memoryBanner();
      window.addEventListener("beforeunload",function(){ if(dirty) persist(); });
      document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden"&&dirty) persist(); });
      document.addEventListener("click",function(e){ var pop=document.getElementById("formspop"); if(pop&&pop.classList.contains("open")&&!pop.closest(".formswrap").contains(e.target)) pop.classList.remove("open"); });
    })();
  })();
  </script>
</body>
</html>
